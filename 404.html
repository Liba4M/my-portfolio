<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Liba Mahmood</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/styles.css?v=2" />
  <link rel="icon" href="/favicon.ico?v=3" type="image/x-icon" />
  <link rel="icon" href="/images/favicon-rose.svg?v=3" type="image/svg+xml" />
</head>
<body>

  <canvas id="matrix-rain" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="error-page">
    <p class="eyebrow"><span class="dot"></span> SYSTEM ERROR // 404</p>
    <h1 class="glitch-heading cursive-name" data-text="404">404</h1>
    <p class="error-message">
      <span class="prompt">$</span> cat page.html<br />
      <span class="error-line">cat: page.html: No such file or directory</span>
    </p>
    <p class="error-sub">This page doesn't exist — it may have been moved or the link's incorrect.</p>

    <div class="hero-actions" style="justify-content:center; margin-top: 32px;">
      <a href="/" class="btn-solid"><i class="fas fa-terminal"></i> Back to Portfolio</a>
      <a href="/tutoring/" class="btn-ghost"><i class="fas fa-graduation-cap"></i> Go to Tutoring</a>
    </div>
  </main>

  <script src="/scripts.js?v=2"></script>
</body>
</html>
